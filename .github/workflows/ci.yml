name: Validate and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test change selection
        run: node --test scripts/*.check.mjs
      - name: Detect affected areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/changed-areas.mjs
      - name: Check for committed credentials
        run: node scripts/check-secrets.mjs

  validate_frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  validate_backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: push
      - run: cargo fmt --manifest-path push/Cargo.toml --check
      - run: cargo clippy --manifest-path push/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path push/Cargo.toml

  deploy_backend:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.backend == 'true'
    needs: [changes, validate_backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: biorotina-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: push
      - run: npm ci
      - name: Check billing configuration before deploy
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$ASAAS_API_KEY" || { echo 'ASAAS_API_KEY ausente' >&2; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY ausente' >&2; exit 1; }
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo 'VITE_GOOGLE_CLIENT_ID ausente' >&2; exit 1; }
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      - name: Install Lambda build tool
        run: |
          cargo_lambda_asset=cargo-lambda-v1.9.2.x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 \
            "https://github.com/cargo-lambda/cargo-lambda/releases/download/v1.9.2/$cargo_lambda_asset" \
            -o "$RUNNER_TEMP/$cargo_lambda_asset"
          echo "b5c258c424ebaef39541c3641f33c51137ee6c426016f365628fedb2c737271d  $RUNNER_TEMP/$cargo_lambda_asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cargo-lambda-bin"
          tar -xzf "$RUNNER_TEMP/$cargo_lambda_asset" -C "$RUNNER_TEMP/cargo-lambda-bin"
          echo "$RUNNER_TEMP/cargo-lambda-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-lambda-bin/cargo-lambda" lambda --version
      - name: Build push service
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" CARGO_BUILD_JOBS=2 OPENSSL_STATIC=1 cargo lambda build --release --disable-optimizations --output-format zip --bins --manifest-path push/Cargo.toml
          cp push/target/lambda/biorotina-api/bootstrap.zip push/target/lambda/biorotina-api.zip
          cp push/target/lambda/biorotina-tick/bootstrap.zip push/target/lambda/biorotina-tick.zip
          cp push/target/lambda/biorotina-billing-api/bootstrap.zip push/target/lambda/biorotina-billing-api.zip
          cp push/target/lambda/biorotina-telemetry/bootstrap.zip push/target/lambda/biorotina-telemetry.zip
      - name: Deploy AWS stack
        run: npx serverless deploy
        env:
          ENABLE_CUSTOM_DOMAIN: ${{ vars.ENABLE_CUSTOM_DOMAIN || 'true' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Configure billing secrets and Asaas webhook
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/configure-billing.mjs

  deploy_frontend:
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.validate_frontend.result == 'success' &&
      (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped')
    needs: [changes, validate_frontend, deploy_backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: biorotina-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      - name: Build frontend against deployed API
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          API_URL="$(aws cloudformation describe-stacks --stack-name biorotina-dev --query "Stacks[0].Outputs[?OutputKey=='PushApiUrl'].OutputValue | [0]" --output text)"
          test -n "$API_URL" && test "$API_URL" != None
          VITE_PUSH_API_URL="$API_URL" npm run build
      - name: Publish frontend
        run: |
          BUCKET="$(aws cloudformation describe-stacks --stack-name biorotina-dev --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue | [0]" --output text)"
          DISTRIBUTION="$(aws cloudformation describe-stacks --stack-name biorotina-dev --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue | [0]" --output text)"
          test -n "$BUCKET" && test "$BUCKET" != None
          test -n "$DISTRIBUTION" && test "$DISTRIBUTION" != None
          aws s3 sync dist/ "s3://$BUCKET/" --delete --cache-control 'public,max-age=300'
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control 'no-cache'
          aws s3 cp dist/sw.js "s3://$BUCKET/sw.js" --cache-control 'no-cache'
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'
