[package]
name = "biorotina-push"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "biorotina-api"
path = "src/bin/api.rs"

[[bin]]
name = "biorotina-billing-api"
path = "src/bin/billing_api.rs"

[[bin]]
name = "biorotina-tick"
path = "src/bin/tick.rs"

[[bin]]
name = "biorotina-telemetry"
path = "src/bin/telemetry.rs"

[dependencies]
axum = "0.8"
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-secretsmanager = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
http = "0.2"
lambda_http = { version = "1.3", default-features = false, features = ["apigw_http"] }
lambda_runtime = "1.4"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
web-push = { version = "0.11", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
